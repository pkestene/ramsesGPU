#
# Hydro 2D example parameter file: Spherical Blast wave
#
# see Athena test suite :
# http://www.astro.princeton.edu/~jstone/Athena/tests/blast/blast.html
#

[run]
tend=0.2
noutput=10000
nstepmax=100
nlog=10

[mesh]
nx=96
ny=96
nz=96

xmin=0.0
xmax=1.0
ymin=0.0
ymax=1.0
zmin=0.0
zmax=1.0

# BoundaryConditionType :
# BC_UNDEFINED=0
# BC_DIRICHLET=1
# BC_NEUMANN=2
# BC_PERIODIC=3
boundary_xmin=3
boundary_xmax=3
boundary_ymin=3
boundary_ymax=3
boundary_zmin=3
boundary_zmax=3

[hydro]
problem=blast
niter_riemann=10
iorder=2
slope_type=2.0
scheme=muscl
XLAMBDA=0.25
YLAMBDA=0.25
ALPHA_KT=1.4
cfl=0.8
riemannSolver=hllc
smallr=1e-8
smallc=1e-8
unsplitVersion=3

[hydro_unsplit_version_3]
dim_x=10
dim_y=10
dim_z=8

[blast]
radius = 0.25
density_in = 1.0
density_out = 1.0
pressure_in = 10.0
pressure_out = 0.1

[visu]
minvar=0.0
maxvar=8.0
manualContrast=1

[output]
latexAnimation=no
outputDir=./
outputPrefix=blast3d
colorPng=no
outputVtk=no
outputHdf5=yes
outputXsm=no
outputPng=no
